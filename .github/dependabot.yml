# Weekly dependency update PRs; minor/patch updates are grouped to keep noise down.
# Security updates are raised immediately regardless of this schedule.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
