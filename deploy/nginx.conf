# Alternative to Caddy: /etc/nginx/sites-available/cloudchat
# Get a certificate first, e.g.: sudo certbot --nginx -d chat.example.com
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;

    # Files are limited to 10 MB by the app; nginx's default is only 1 MB.
    client_max_body_size 12m;

    # The app logs requests itself with private IDs removed.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;   # the app pings every ~54s
        proxy_send_timeout 120s;

        # Keep the original Host (the WebSocket same-origin check needs it)
        # and the real client IP (rate limits need it; set TRUSTED_PROXIES).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
