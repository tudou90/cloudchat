# Add to (or replace the matching lines in) /etc/redis/redis.conf,
# then: sudo systemctl restart redis-server

# Only reachable from this machine.
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# Set a long random password and put the same value in REDIS_PASSWORD.
#   openssl rand -hex 32
requirepass CHANGE_ME_TO_A_LONG_RANDOM_PASSWORD

# Memory: Redis holds messages, secret notes and file metadata (file contents
# are on disk). Keep STORAGE_LIMIT_MB in .env below this, so CloudChat stops
# accepting new rooms/secrets before Redis is full.
maxmemory 512mb
# Nearly every CloudChat key has a TTL; if memory ever fills, evict the keys
# closest to expiring rather than failing all writes.
maxmemory-policy volatile-ttl

# No persistence: chats are meant to disappear. Snapshots or an append-only
# file would keep "deleted" messages and files on disk.
save ""
appendonly no
